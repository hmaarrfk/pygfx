# TEMPORARY -- deleted once the question is answered.
#
# Can the examples actually be tested on python 3.10? imgui-bundle publishes no
# cp310 wheels since 1.6.0, so pip falls back to the sdist. That build failed
# on the runner with "RandR headers not found", which is a missing apt package
# rather than a real incompatibility -- so install glfw's X11 build deps and
# find out whether it builds at all, how long it takes, and whether the example
# suite then passes.
name: probe

on:
  push:
    branches:
      - ci-screenshot-flakiness
  workflow_dispatch:

jobs:
  py310-from-source:
    name: examples on ${{ matrix.pyversion }} (imgui from source)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyversion: ['3.10']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.pyversion }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.pyversion }}
    - name: Install llvmpipe and lavapipe for offscreen canvas
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
    - name: Install glfw build dependencies (needed to build imgui-bundle)
      run: |
        sudo apt-get install -y xorg-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        echo "::group::pip install"
        start=$(date +%s)
        pip install -e .[examples]
        echo "IMGUI_BUILD_SECONDS=$(( $(date +%s) - start ))"
        echo "::endgroup::"
        python -c "import imgui_bundle; print('imgui_bundle', imgui_bundle.__version__)"
    - name: Show wgpu backend
      run: |
        python -c "import pygfx; print(pygfx.__version__)"
        python -c "from examples.tests.testutils import adapter; print(adapter.info)"
    - name: Test examples
      env:
        PYGFX_EXPECT_LAVAPIPE: "true"
      run: |
        pytest -v examples
