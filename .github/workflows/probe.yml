# TEMPORARY diagnostic workflow -- to be deleted before this PR is merged.
#
# Goal: find out what makes the five flaky `validate_*` screenshot comparisons
# render differently on some ubuntu-latest runners and not others, given that
# the OS image, the mesa build, the python version and the pip set are all
# byte-identical between a passing and a failing job.
name: probe

on:
  push:
    branches:
      - ci-screenshot-flakiness
  workflow_dispatch:

jobs:
  probe:
    name: probe ${{ matrix.n }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install llvmpipe and lavapipe for offscreen canvas
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[examples]
    - name: CPU identity
      run: |
        echo "=== model ==="
        grep -m1 "^model name" /proc/cpuinfo
        grep -m1 "^vendor_id" /proc/cpuinfo
        grep -m1 "^cpu family" /proc/cpuinfo
        grep -m1 "^model\b" /proc/cpuinfo
        grep -m1 "^stepping" /proc/cpuinfo
        echo "nproc=$(nproc)"
        echo "=== interesting flags ==="
        for f in avx avx2 avx512f avx512vl fma f16c bmi2 sse4_2; do
          grep -qw "$f" /proc/cpuinfo && echo "  $f: yes" || echo "  $f: NO"
        done
    - name: Render hashes
      env:
        PYGFX_EXPECT_LAVAPIPE: "true"
      run: |
        for cfg in "default" "LP_NUM_THREADS=1" "LP_NATIVE_VECTOR_WIDTH=128" "GALLIVM_PERF=no_filter_hacks,no_quad_lod"; do
          echo "############ config: $cfg"
          if [ "$cfg" = "default" ]; then
            python probe_render.py
          else
            env "$cfg" python probe_render.py
          fi
        done
